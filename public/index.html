<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Blocks</title>
    <style>
        [hidden] {
            display: none !important;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--page);
            color: var(--text);
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        canvas {
            position: fixed;
            inset: 0;
            display: block;
        }

        button, input {
            font: inherit;
        }

        button {
            background: var(--button);
            color: var(--text);
            border: 2px solid var(--button-border);
            padding: 6px 14px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: var(--button-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        input {
            background: var(--input);
            color: var(--text);
            border: 2px solid var(--input-border);
            padding: 6px 8px;
            min-width: 0;
        }

        /* ---- Lobby ---- */

        #lobby {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--overlay);
        }

        #panel {
            width: min(460px, 92vw);
            display: grid;
            gap: 12px;
            padding: 20px;
            background: var(--panel);
            border: 4px solid var(--panel-border);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        h2 {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row input {
            flex: 1;
        }

        #list {
            display: grid;
            gap: 6px;
            max-height: 40vh;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            list-style: none;
        }

        #list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: var(--row);
        }

        #list li.empty {
            justify-content: center;
            opacity: 0.6;
        }

        #list span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #status {
            min-height: 1.2em;
            color: var(--error);
            font-size: 13px;
        }

        /* ---- In-game overlay ---- */

        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }

        #hud button {
            pointer-events: auto;
        }

        #mode {
            color: var(--accent);
        }

        #players {
            margin: 4px 0 0;
            padding: 0;
            list-style: none;
            font-size: 13px;
        }

        #cross {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
        }

        #hint {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
        }

        #held {
            position: fixed;
            bottom: 74px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
        }

        #hotbar {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            pointer-events: none;
        }

        .slot {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--slot);
            border: 3px solid var(--slot-border);
        }

        .slot.selected {
            border-color: var(--slot-selected);
        }

        .slot span {
            position: absolute;
            top: 0;
            left: 3px;
            font-size: 10px;
            text-shadow: 1px 1px 0 #000;
        }

        .slot img {
            width: 28px;
            height: 28px;
            image-rendering: pixelated;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "/three/three.module.js" } }
    </script>
</head>
<body>
    <div id="lobby">
        <div id="panel">
            <h1>BLOCKS</h1>
            <input id="name" placeholder="Your name" maxlength="16">
            <div class="row">
                <input id="rname" placeholder="Server name" maxlength="24">
                <button id="create">Create</button>
            </div>
            <h2>Servers</h2>
            <ul id="list"></ul>
            <div id="status"></div>
        </div>
    </div>

    <div id="hud" hidden>
        <div>
            <div id="room"></div>
            <div id="mode"></div>
            <ul id="players"></ul>
        </div>
        <button id="leave">Leave</button>
    </div>

    <div id="cross" hidden>+</div>
    <div id="held" hidden></div>
    <div id="hotbar" hidden></div>
    <div id="hint" hidden></div>
    
    <script type="module" src="./scripts/config.js"></script>
    <script type="module" src="./scripts/visuals.js"></script>
    <script type="module" src="./main.js"></script>
</body>
</html>
